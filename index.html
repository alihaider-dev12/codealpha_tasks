<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator - CodeAlpha</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="quote-container">
        <h2><i class="fa-solid fa-quote-left"></i> Daily Inspiration</h2>
        
        <div class="quote-box">
            <p id="quote-text" class="quote">Loading quote...</p>
            <p id="author-name" class="author"></p>
        </div>

        <div class="main-btn-row">
            <button id="new-quote-btn"><i class="fa-solid fa-rotate"></i> New Quote</button>
            <button id="native-share-btn" class="share-btn" title="Share via Mobile/Apps"><i class="fa-solid fa-share-nodes"></i> Share App</button>
        </div>

        <div class="social-share-row">
            <p class="share-label">Instant Share To:</p>
            <div class="icon-group">
                <button id="whatsapp-btn" class="social-icon wa" title="Share on WhatsApp"><i class="fa-brands fa-whatsapp"></i></button>
                <button id="fb-btn" class="social-icon fb" title="Share on Facebook"><i class="fa-brands fa-facebook-f"></i></button>
                <button id="msg-btn" class="social-icon msg" title="Share on Messenger"><i class="fa-brands fa-facebook-messenger"></i></button>
                <button id="tweet-btn" class="social-icon tw" title="Share on X / Twitter"><i class="fa-brands fa-x-twitter"></i></button>
                <button id="insta-btn" class="social-icon insta" title="Copy for Instagram Story/DM"><i class="fa-brands fa-instagram"></i></button>
                <button id="copy-btn" class="social-icon copy" title="Copy Quote"><i class="fa-regular fa-copy"></i></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
